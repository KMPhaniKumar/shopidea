name: Deploy

# Backend runs on AWS ECS Fargate (cluster reelmart-dev, ap-south-1); images in
# ECR (reelmart/<service>:dev-latest). Web on Vercel; DB on Supabase.
#
# One-time setup required (GitHub repo settings → Secrets and variables → Actions):
#   AWS_DEPLOY_ROLE_ARN   IAM role this repo can assume via GitHub OIDC, with
#                         ECR push + ecs:UpdateService/Describe permissions.
#                         (Create an OIDC provider for token.actions.githubusercontent.com
#                          and a role trusting this repo.)
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_DB_URL, SUPABASE_PROJECT_REF, SUPABASE_ACCESS_TOKEN
#
# (If you prefer static keys over OIDC, swap the configure-aws-credentials step
#  for aws-access-key-id/aws-secret-access-key secrets.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 632127307144.dkr.ecr.ap-south-1.amazonaws.com
  ECS_CLUSTER: reelmart-dev

jobs:
  # ---- Build & lint (runs on PRs and pushes) -------------------------------
  build-services:
    name: Build backend services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-service
          - analytics-service
          - catalog-service
          - delivery-service
          - notification-service
          - order-service
          - payment-service
          - payout-service
          - return-service
          - whatsapp-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Type-check & build
        working-directory: reelmart/services/${{ matrix.service }}
        run: |
          npm install
          npm run build

  lint-web:
    name: Lint & Build Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reelmart/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: reelmart/apps/web/package-lock.json
      - run: npm ci
      - run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ---- Deploy (push to main only) ------------------------------------------
  deploy-services:
    name: Deploy ${{ matrix.service }} to Fargate
    # Intentionally NOT `needs: build-services`: that job is a 10-service matrix,
    # so a single service failing to build would mark the whole job failed and
    # skip ALL deploys (this is why nothing deployed after May 9). Each leg here
    # builds its own image, so a broken service fails only its own leg
    # (fail-fast:false) and the other nine still deploy.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # for AWS OIDC
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-service
          - analytics-service
          - catalog-service
          - delivery-service
          - notification-service
          - order-service
          - payment-service
          - payout-service
          - return-service
          - whatsapp-service
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Role ARN is not a secret (account id is already in ECR_REGISTRY).
          # Hardcoded so a missing/blank AWS_DEPLOY_ROLE_ARN secret can't break auth.
          role-to-assume: arn:aws:iam::632127307144:role/reelmart-gha-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        run: aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - name: Build, push & roll out
        run: |
          IMAGE=$ECR_REGISTRY/reelmart/${{ matrix.service }}:dev-latest
          docker build -t "$IMAGE" reelmart/services/${{ matrix.service }}
          docker push "$IMAGE"
          aws ecs update-service --cluster $ECS_CLUSTER --service ${{ matrix.service }} --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services ${{ matrix.service }}

  deploy-web:
    name: Deploy Web to Vercel
    needs: lint-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Web normally ships via Vercel's own GitHub integration on push to main.
    # This CLI deploy is a fallback that self-skips when the Vercel secrets are
    # absent (the `secrets` context isn't allowed in a job-level `if`, so we map
    # the token to env and gate the steps on it). This keeps deploys green
    # instead of failing on an empty --token every push.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - if: env.VERCEL_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - if: env.VERCEL_TOKEN != ''
        run: npm install -g vercel
      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        run: vercel --prod --yes --token "$VERCEL_TOKEN"
        working-directory: reelmart/apps/web

  deploy-supabase:
    name: Apply Supabase Migrations
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Migrations are normally applied via the supabase CLI / db-migrate skill.
    # This job self-skips when SUPABASE_DB_URL is absent (the `secrets` context
    # isn't allowed in a job-level `if`, so we map it to env and gate the steps)
    # — otherwise it would fail on an empty --db-url and show false-red every push.
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - if: env.SUPABASE_DB_URL != ''
        uses: actions/checkout@v4
      - if: env.SUPABASE_DB_URL != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push DB migrations
        if: env.SUPABASE_DB_URL != ''
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        working-directory: reelmart
      - name: Deploy Edge Functions
        if: env.SUPABASE_DB_URL != '' && env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        working-directory: reelmart
