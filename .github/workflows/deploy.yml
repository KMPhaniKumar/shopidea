name: Deploy

# Backend runs on AWS ECS Fargate (cluster reelmart-dev, ap-south-1); images in
# ECR (reelmart/<service>:dev-latest). Web on Vercel; DB on Supabase.
#
# One-time setup required (GitHub repo settings → Secrets and variables → Actions):
#   AWS_DEPLOY_ROLE_ARN   IAM role this repo can assume via GitHub OIDC, with
#                         ECR push + ecs:UpdateService/Describe permissions.
#                         (Create an OIDC provider for token.actions.githubusercontent.com
#                          and a role trusting this repo.)
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_DB_URL, SUPABASE_PROJECT_REF, SUPABASE_ACCESS_TOKEN
#
# (If you prefer static keys over OIDC, swap the configure-aws-credentials step
#  for aws-access-key-id/aws-secret-access-key secrets.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 632127307144.dkr.ecr.ap-south-1.amazonaws.com
  ECS_CLUSTER: reelmart-dev

jobs:
  # ---- Build & lint (runs on PRs and pushes) -------------------------------
  build-services:
    name: Build backend services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-service
          - analytics-service
          - catalog-service
          - delivery-service
          - notification-service
          - order-service
          - payment-service
          - payout-service
          - return-service
          - whatsapp-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Type-check & build
        working-directory: reelmart/services/${{ matrix.service }}
        run: |
          npm install
          npm run build

  lint-web:
    name: Lint & Build Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reelmart/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: reelmart/apps/web/package-lock.json
      - run: npm ci
      - run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ---- Deploy (push to main only) ------------------------------------------
  deploy-services:
    name: Deploy ${{ matrix.service }} to Fargate
    needs: build-services
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # for AWS OIDC
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-service
          - analytics-service
          - catalog-service
          - delivery-service
          - notification-service
          - order-service
          - payment-service
          - payout-service
          - return-service
          - whatsapp-service
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        run: aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - name: Build, push & roll out
        run: |
          IMAGE=$ECR_REGISTRY/reelmart/${{ matrix.service }}:dev-latest
          docker build -t "$IMAGE" reelmart/services/${{ matrix.service }}
          docker push "$IMAGE"
          aws ecs update-service --cluster $ECS_CLUSTER --service ${{ matrix.service }} --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services ${{ matrix.service }}

  deploy-web:
    name: Deploy Web to Vercel
    needs: lint-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g vercel
      - name: Deploy
        run: vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        working-directory: reelmart/apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-supabase:
    name: Apply Supabase Migrations
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push DB migrations
        run: supabase db push --db-url ${{ secrets.SUPABASE_DB_URL }}
        working-directory: reelmart
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        working-directory: reelmart
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
